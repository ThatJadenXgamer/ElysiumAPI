plugins {
    id 'java-library'
    id 'idea'
}

def asphodelExt = extensions.findByName('asphodel')
if (asphodelExt == null) {
    asphodelExt = extensions.create('asphodel', asphodel.gradle.AsphodelExtension)
}
if (extensions.findByName('asphodelExt') == null) {
    extensions.add('asphodelExt', asphodelExt)
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = 'NeoForge'
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

java {
    toolchain.languageVersion.set(project.provider {
        def propertyKey = asphodelExt.propertyKey
        if (propertyKey == null) {
            throw new GradleException("asphodel { version = '...' } must be configured in ${project.path}")
        }
        JavaLanguageVersion.of(project.property("java_${propertyKey}").toString())
    } as Provider<? extends JavaLanguageVersion>)
    withSourcesJar()
}

project.afterEvaluate {
    def projectName = project.name
    def loader = asphodelExt.loader
    def version = asphodelExt.version

    if (loader == null || loader.isEmpty()) {
        throw new GradleException("asphodel { loader = '...' } must be configured in ${project.path}")
    }
    if (version == null || version.isEmpty()) {
        throw new GradleException("asphodel { version = '...' } must be configured in ${project.path}")
    }

    def propertyKey = asphodelExt.propertyKey
    def prop = { String name -> project.hasProperty(name) ? project.property(name).toString() : null }

    if (prop("mc_${propertyKey}") == null) {
        throw new GradleException("Missing property 'mc_${propertyKey}' required by ${project.path}")
    }
    if (prop("java_${propertyKey}") == null) {
        throw new GradleException("Missing property 'java_${propertyKey}' required by ${project.path}")
    }

    def sharedRootName = (rootProject.findProperty('asphodel_shared_root') ?: '1_20_1_vanilla').toString()
    def isSharedRoot = projectName == sharedRootName

    def mcVer = version
    def javaVer = prop("java_${propertyKey}")

    project.ext.asphodelMcVersion = mcVer
    project.ext.asphodelJavaVersion = javaVer
    project.ext.asphodelLoader = loader

    project.ext.mc = mcVer
    project.ext.java = javaVer
    project.ext.minecraft_range = prop("minecraft_range_${propertyKey}") ?: "[${mcVer},)"

    ['fabric_loader', 'quilt_loader', 'forge', 'forge_range', 'neoforge', 'neoforge_range'].each { baseName ->
        def value = prop("${baseName}_${propertyKey}")
        if (value != null) {
            project.ext.set(baseName, value)
        }
    }

    base {
        archivesName = "${project.mod_id}-${projectName}-${mcVer}"
    }

    def javaSourceDirFile = rootProject.file('src/main/java')
    def mainResourceDirFile = rootProject.file('src/main/resources')
    def versionJavaDirFile = rootProject.file("src/overlays/${version}/java")
    def versionResourceDirFile = rootProject.file("src/overlays/${version}/resources")
    def loaderJavaDirFile = rootProject.file("src/overlays/${version}-${loader}/java")
    def loaderResourceDirFile = rootProject.file("src/overlays/${version}-${loader}/resources")

    def assembleTask = tasks.register('assembleSources', asphodel.gradle.AssembleSourcesTask) {
        javaSourceDirs.from(javaSourceDirFile, versionJavaDirFile, loaderJavaDirFile)
        mainResourcesDir.from(mainResourceDirFile)
        versionResourcesDir.from(versionResourceDirFile)
        loaderResourcesDir.from(loaderResourceDirFile)
        targetLoader.set(loader)
        targetVersion.set(mcVer)
        projectDirectory.set(project.layout.projectDirectory)
        outputJavaDir.set(layout.buildDirectory.dir('generated/assembled/java'))
        outputResourcesDir.set(layout.buildDirectory.dir('generated/assembled/resources'))
        stateFile.set(layout.buildDirectory.file('asphodel/assemble-state.tsv'))
    }

    def javaSrcDirs = []
    def resourceSrcDirs = []
    if (isSharedRoot) {
        javaSrcDirs = [javaSourceDirFile, versionJavaDirFile]
        resourceSrcDirs = [mainResourceDirFile, versionResourceDirFile]
    } else if (loader == 'vanilla') {
        javaSrcDirs = [versionJavaDirFile]
        resourceSrcDirs = [versionResourceDirFile]
    } else {
        javaSrcDirs = [loaderJavaDirFile]
        resourceSrcDirs = [mainResourceDirFile, versionResourceDirFile, loaderResourceDirFile]
    }
    sourceSets.main.java.setSrcDirs(javaSrcDirs)
    sourceSets.main.resources.setSrcDirs(resourceSrcDirs)

    def mergedOutputDir = layout.buildDirectory.dir("classes")
    sourceSets.main.output.resourcesDir = mergedOutputDir.get().asFile
    sourceSets.main.java.destinationDirectory = mergedOutputDir

    def sharedRootProject = null
    def versionVanillaProject = null
    if (!isSharedRoot) {
        def candidateShared = rootProject.findProject(":${sharedRootName}")
        if (candidateShared != null && candidateShared != project) {
            sharedRootProject = candidateShared
            dependencies {
                compileOnly sharedRootProject
            }
        }
        if (loader != 'vanilla') {
            def candidateVanilla = rootProject.findProject(":${propertyKey}_vanilla")
            if (candidateVanilla != null && candidateVanilla != project) {
                versionVanillaProject = candidateVanilla
                dependencies {
                    compileOnly versionVanillaProject
                }
            }
        }
    }

    tasks.named('compileJava', JavaCompile) {
        dependsOn assembleTask
        source = fileTree(assembleTask.flatMap { it.outputJavaDir })
        if (sharedRootProject != null) dependsOn "${sharedRootProject.path}:processResources"
        if (versionVanillaProject != null) dependsOn "${versionVanillaProject.path}:processResources"
    }

    def generatedAccessDir = layout.buildDirectory.dir('generated/access').get().asFile
    asphodel.gradle.access.AccessAgentProcessor.process(rootProject.projectDir.toPath(), loader, mcVer, generatedAccessDir.toPath(), logger)

    def mergedWidenerFile = layout.buildDirectory.file('generated/access/merged.accesswidener')
    def mergedTransformerFile = layout.buildDirectory.file('generated/access/merged.accesstransformer.cfg')

    def registerAccessTransformers = { Object extension, File atFile, String pluginName, String extensionName ->
        if (extension == null) {
            logger.warn("Asphodel: source-set '{}' is configured with loader '{}' but no '{}' extension is available on the project; skipping access transformer auto-registration", project.path, loader, extensionName)
            return
        }
        try {
            extension.accessTransformers.from(atFile)
            logger.info("Asphodel: auto-registered merged access transformer with {} on '{}'", pluginName, project.path)
        } catch (Exception ex) {
            logger.warn("Asphodel: failed to auto-register merged access transformer with {} on '{}': {}. Register it manually in build.gradle via '{}.accessTransformers.from(file(\"build/generated/access/merged.accesstransformer.cfg\"))'.", pluginName, project.path, ex.message, extensionName)
        }
    }

    if (loader == 'vanilla' || loader == 'fabric' || loader == 'quilt') {
        def loomExtension = project.extensions.findByName('loom')
        if (loomExtension == null && loader == 'quilt') {
            loomExtension = project.extensions.findByName('quilt')
        }
        if (loomExtension != null) {
            loomExtension.accessWidenerPath.set(mergedWidenerFile)
        } else logger.warn("Asphodel: source-set '{}' is configured with loader '{}' but no Loom plugin is applied; skipping accessWidenerPath auto-wiring", project.path, loader)
    } else if (loader == 'forge') {
        registerAccessTransformers(project.extensions.findByName('minecraft'),
                mergedTransformerFile.get().asFile, 'ForgeGradle', 'minecraft')
    } else if (loader == 'neoforge') {
        def neoForgeExtension = project.extensions.findByName('neoForge')
        def neoForgeExtensionName = 'neoForge'
        if (neoForgeExtension == null) {
            neoForgeExtension = project.extensions.findByName('minecraft')
            neoForgeExtensionName = 'minecraft'
        }
        registerAccessTransformers(neoForgeExtension,
                mergedTransformerFile.get().asFile, 'ModDevGradle', neoForgeExtensionName)
    }

    tasks.named('processResources', ProcessResources) {
        dependsOn assembleTask

        def assembledResources = assembleTask.flatMap { it.outputResourcesDir }
        from(assembledResources)
        exclude { element ->
            def assembledRoot = assembledResources.get().asFile.toPath().toAbsolutePath()
            !element.file.toPath().toAbsolutePath().startsWith(assembledRoot)
        }

        def expandProps = [
                'version', 'group', 'mod_id', 'mod_name', 'mod_author',
                'license', 'credits', 'description',
                'mc', 'java', 'minecraft_range',
                'fabric_loader',
                'quilt_loader',
                'forge', 'forge_range',
                'neoforge', 'neoforge_range'
        ].collectEntries { name ->
            [(name): project.hasProperty(name) ? project.property(name).toString() : '']
        }

        filesMatching([
                'pack.mcmeta',
                'fabric.mod.json',
                'quilt.mod.json',
                'META-INF/mods.toml',
                'META-INF/neoforge.mods.toml',
                '*.mixins.json'
        ]) {
            expand expandProps
        }

        inputs.properties(expandProps)
    }

    tasks.named('sourcesJar', Jar) {
        dependsOn assembleTask
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    jar {
        from(rootProject.file('LICENSE')) {
            rename { "${it}_${project.mod_name}" }
        }
        manifest {
            attributes([
                    'Specification-Title'   : project.mod_name.toString(),
                    'Specification-Vendor'  : project.mod_author.toString(),
                    'Specification-Version' : project.version.toString(),
                    'Implementation-Title'  : projectName,
                    'Implementation-Version': project.version.toString(),
                    'Implementation-Vendor' : project.mod_author.toString(),
                    'Built-On-Minecraft'    : mcVer
            ])
        }
    }
}