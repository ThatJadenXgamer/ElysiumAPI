plugins {
    id 'asphodel-loader'
    id 'fabric-loom'
}

asphodel {
    loader = 'vanilla'
    version = '1.21.1'
}

dependencies {
    minecraft "com.mojang:minecraft:${project.property('mc_1_21_1')}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.property('parchment_mc_1_21_1')}:${project.property('parchment_ver_1_21_1')}@zip")
    }
    compileOnly "net.fabricmc:sponge-mixin:0.15.4+mixin.0.8.7"
    annotationProcessor "net.fabricmc:sponge-mixin:0.15.4+mixin.0.8.7"
    compileOnly "io.github.llamalad7:mixinextras-fabric:0.4.1"
}

loom {
    mixin {
        defaultRefmapName.set("${project.mod_id}.refmap.json")
    }
}