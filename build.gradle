plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.124'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

group = project.mod_group_id
version = project.mod_version

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup("curse.maven")
        }
    }
    maven {
        name = "KosmX's maven"
        url = 'https://maven.kosmx.dev/'
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
}

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    enable {
        version = neoforge_version
        disableRecompilation = false
    }
    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            jvmArguments = ['-Xmx2G']
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "curse.maven:terrablender-940057:6054947"
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    compileOnly "dev.emi:emi-neoforge:1.1.22+1.21.1:api"
    runtimeOnly "dev.emi:emi-neoforge:1.1.22+1.21.1"

    compileOnly "org.spongepowered:mixin:0.8.5"
}

def charonBootstrap = tasks.register('charonBootstrap', JavaCompile) {
    source = sourceSets.main.java
    include 'net/jadenxgamer/elysium_api/api/charon/**'
    include 'net/jadenxgamer/elysium_api/processor/**'
    classpath = configurations.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('charon-bootstrap')
    options.encoding = 'UTF-8'
}

tasks.named('compileJava', JavaCompile) {
    dependsOn charonBootstrap
    inputs.dir(charonBootstrap.flatMap { it.destinationDirectory })
    options.annotationProcessorPath = files(
            charonBootstrap.flatMap { it.destinationDirectory }
    )
    options.compilerArgs.addAll([
            '-processor', 'net.jadenxgamer.elysium_api.processor.CharonProcessor'
    ])
}

tasks.named('processResources', ProcessResources) {
    dependsOn tasks.named('compileJava')
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version       : neoforge_version,
            player_anim_version    : player_anim_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = mod_id
        }
    }
    repositories {
        maven {
            name = "local"
            url = layout.buildDirectory.dir("repo")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}